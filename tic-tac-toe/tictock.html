<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TicTock Game</h1>
    <div id="status">Player X's turn</div>
    <div id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <div id="mode-toggle">
  <button onclick="setMode('human')" id="btn-human">2 Player</button>
  <button onclick="setMode('ai')" id="btn-ai" class="active">vs AI</button>
</div>
    <div id="difficulty">
  <button onclick="setDifficulty(2)">Easy</button>
  <button onclick="setDifficulty(4)">Medium</button>
  <button onclick="setDifficulty(9)" class="active">Hard</button>
</div>
    <button id="reset-button">Reset Game</button>
    <script>
        let difficulty = 9; // 9 = unbeatable, 2 = easy, 4 = medium
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';    
        let gameActive = true;
        let mode = "ai"; // "ai" or "human"
        const cells=document.querySelectorAll(".cell");
        const statusDiv=document.getElementById("status");
        const resetBtn=document.getElementById("reset-button");
        cells.forEach(function(cell){
            cell.addEventListener("click",handleClick);
        })
        function setMode(selected) {
  mode = selected;

  document.getElementById("btn-human").classList.toggle("active", selected === "human");
  document.getElementById("btn-ai").classList.toggle("active", selected === "ai");

  // hide difficulty buttons when in 2 player mode
  document.getElementById("difficulty").style.display = selected === "ai" ? "flex" : "none";

  resetGame();
}
       function handleClick(event) {
  const index = event.target.getAttribute("data-index");

  if (board[index] !== "" || gameActive === false) {
    return;
  }

  board[index] = currentPlayer;
  event.target.textContent = currentPlayer;
  event.target.classList.add(currentPlayer.toLowerCase());

  checkWinner();

  if (!gameActive) return;

  // switch turns
  if (currentPlayer === "X") {
    currentPlayer = "O";
  } else {
    currentPlayer = "X";
  }

  // respond based on mode
  if (mode === "ai" && currentPlayer === "O" && gameActive) {
    statusDiv.textContent = "AI is thinking...";
    setTimeout(aiMove, 300);
  } else {
    statusDiv.textContent = "Player " + currentPlayer + "'s turn";
  }
}
    const winningConditions=[
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
];
function checkWinner(){
    for(let i=0;i<winningConditions.length;i++){
        const [a,b,c]=winningConditions[i];
        if(board[a]===""||board[b]===""||board[c]===""){
            continue;
        }
        if(board[a]===board[b]&&board[b]===board[c]){
            statusDiv.textContent=`player${board[a]} wins!`;
            gameActive=false;
            return;
        }
    }
    if(!board.includes("")){
        statusDiv.textContent="It's a draw!";
        gameActive=false;
    }
}
function resetGame() {
  board = ["", "", "", "", "", "", "", "", ""];
  currentPlayer = "X";
  gameActive = true;
  statusDiv.textContent = "Player X's turn";

  cells.forEach(function(cell) {
    cell.textContent = "";
  });
}

resetBtn.addEventListener("click", resetGame);
function setDifficulty(level) {
  difficulty = level;
  document.querySelectorAll("#difficulty button").forEach(btn => {
    btn.classList.remove("active");
  });
  event.target.classList.add("active");
  resetGame();
}
function evaluate(){
    for(let i=0;i<winningConditions.length;i++){
        const [a,b,c]=winningConditions[i];
        if(board[a]===board[b]&&board[b]===board[c]){
            if(board[a]==="O"){
                return +10;
            }else if(board[a]==="X"){
                return -10;
            }
        }
    }
    return 0;
}
function minimax(isMaximizing, depth) {
  const score = evaluate();

  if (score === 10 || score === -10) return score;
  if (!board.includes("")) return 0;
  if (depth === 0) return 0; // stop looking further — add this

  if (isMaximizing) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (board[i] === "") {
        board[i] = "O";
        best = Math.max(best, minimax(false, depth - 1)); // pass depth-1
        board[i] = "";
      }
    }
    return best;
  } else {
    let best = +Infinity;
    for (let i = 0; i < 9; i++) {
      if (board[i] === "") {
        board[i] = "X";
        best = Math.min(best, minimax(true, depth - 1)); // pass depth-1
        board[i] = "";
      }
    }
    return best;
  }
}
function aiMove() {
    console.log("AI thinking with depth:", difficulty);
    if (!gameActive) return;
  let bestScore = -Infinity;
  let bestIndex = -1;

  for (let i = 0; i < 9; i++) {
    if (board[i] === "") {
      board[i] = "O";
      let score = minimax(false, difficulty); // human's turn comes next
      board[i] = "";

      if (score > bestScore) {
        bestScore = score;
        bestIndex = i;
      }
    }
  }

  // Play the best move
  board[bestIndex] = "O";
  cells[bestIndex].textContent = "O";
  currentPlayer = "X";
  statusDiv.textContent = "Player X's turn";
  checkWinner();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TicTock Game</h1>
    <div id="status">Player X's turn</div>
    <div id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button id="reset-button">Reset Game</button>
    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';    
        let gameActive = true;
        const cells=document.querySelectorAll(".cell");
        const statusDiv=document.getElementById("status");
        const resetBtn=document.getElementById("reset-button");
        cells.forEach(function(cell){
            cell.addEventListener("click",handleClick);
        })
        function handleClick(event){
            const index=event.target.getAttribute("data-index");
            if(board[index]!=="" || gameActive===false){
                return;
            }
            board[index]=currentPlayer;
            event.target.textContent=currentPlayer;
            checkWinner();
            if(!gameActive){
                return;
            }
            if(currentPlayer==="X"){
                currentPlayer="O";
            }else{
                currentPlayer="X";  
            }
        statusDiv.textContent=`player ${currentPlayer}'s turn`;
        // Was it the human's move? Then let AI respond
  if (currentPlayer === "X") {
    statusDiv.textContent = "Player X's turn";
  } else {
    if(gameActive) {
    statusDiv.textContent = "AI is thinking...";
    setTimeout(aiMove, 300); // small delay so it feels natural
  }
    }
}
    const winningConditions=[
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
];
function checkWinner(){
    for(let i=0;i<winningConditions.length;i++){
        const [a,b,c]=winningConditions[i];
        if(board[a]===""||board[b]===""||board[c]===""){
            continue;
        }
        if(board[a]===board[b]&&board[b]===board[c]){
            statusDiv.textContent=`player${board[a]} wins!`;
            gameActive=false;
            return;
        }
    }
    if(!board.includes("")){
        statusDiv.textContent="It's a draw!";
        gameActive=false;
    }
}
function resetGame() {
  board = ["", "", "", "", "", "", "", "", ""];
  currentPlayer = "X";
  gameActive = true;
  statusDiv.textContent = "Player X's turn";

  cells.forEach(function(cell) {
    cell.textContent = "";
  });
}

resetBtn.addEventListener("click", resetGame);
function evaluate(){
    for(let i=0;i<winningConditions.length;i++){
        const [a,b,c]=winningConditions[i];
        if(board[a]===board[b]&&board[b]===board[c]){
            if(board[a]==="O"){
                return +10;
            }else if(board[a]==="X"){
                return -10;
            }
        }
    }
}
function minimax(isMaximizing){
    const score=evaluate();
    if(score===10 || score===-10)return score;
    if(!board.includes(""))return 0;
    if(isMaximizing){
        let best=-Infinity;
        for(let i=0;i<board.length;i++){
            if(board[i]===""){
                board[i]="O";
                best=Math.max(best,minimax(false));
                board[i]="";
            }
        }        return best;
    }else{
        let best=+Infinity;
        for(let i=0;i<9;i++){
            if(board[i]===""){
                board[i]="X";
                best=Math.min(best,minimax(true));
                board[i]="";
            }
        }
        return best;
    }
}
function aiMove() {
    if (!gameActive) return;
  let bestScore = -Infinity;
  let bestIndex = -1;

  for (let i = 0; i < 9; i++) {
    if (board[i] === "") {
      board[i] = "O";
      let score = minimax(false); // human's turn comes next
      board[i] = "";

      if (score > bestScore) {
        bestScore = score;
        bestIndex = i;
      }
    }
  }

  // Play the best move
  board[bestIndex] = "O";
  cells[bestIndex].textContent = "O";
  currentPlayer = "X";
  statusDiv.textContent = "Player X's turn";
  checkWinner();
}
</script>
</body>
</html>
